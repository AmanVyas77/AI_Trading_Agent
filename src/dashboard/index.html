<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quant Research Platform — Interactive research dashboard for quantitative and fundamental strategy analysis">
    <title>Quant Research Platform — Dashboard</title>

    <!-- Plotly.js from CDN -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ═══════════════════════════════════════════════════════════════
           CSS Design System
           ═══════════════════════════════════════════════════════════════ */
        :root {
            --bg:           #0d1117;
            --surface:      #161b22;
            --surface-alt:  #1c2333;
            --border:       #30363d;
            --text:         #c9d1d9;
            --text-muted:   #8b949e;
            --accent:       #58a6ff;
            --accent-alt:   #7ee787;
            --red:          #f85149;
            --orange:       #d29922;
            --purple:       #bc8cff;
            --cyan:         #39d2c0;
            --green:        #3fb950;
            --radius:       8px;
            --radius-lg:    12px;
            --shadow:       0 2px 12px rgba(0,0,0,0.4);
            --transition:   0.2s ease;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* ── Header ──────────────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, #161b22 0%, #1c2333 100%);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-alt) 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--bg);
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .header h1 span {
            color: var(--accent);
        }

        .header-meta {
            display: flex;
            gap: 24px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-meta .meta-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .meta-label {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .meta-value {
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
        }

        .phase-badge {
            background: rgba(88,166,255,0.12);
            border: 1px solid rgba(88,166,255,0.3);
            border-radius: 20px;
            padding: 3px 12px;
            font-size: 11px;
            color: var(--accent);
            font-weight: 500;
        }

        /* ── Tabs ────────────────────────────────────────────────── */
        .tab-bar {
            display: flex;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            gap: 0;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 14px 24px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all var(--transition);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            color: var(--text);
            background: rgba(88,166,255,0.06);
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(88,166,255,0.08);
        }

        /* ── Tab Panels ──────────────────────────────────────────── */
        .tab-panel {
            display: none;
            padding: 28px 32px;
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Chart Containers ────────────────────────────────────── */
        .chart-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 24px;
            min-height: 420px;
            box-shadow: var(--shadow);
        }

        .chart-container .js-plotly-plot {
            border-radius: var(--radius);
        }

        /* ── Metrics Cards Grid ──────────────────────────────────── */
        .metric-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .metric-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .metric-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.5);
        }

        .metric-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(48,54,61,0.5);
        }

        .metric-row:last-child { border-bottom: none; }

        .metric-row span:first-child {
            color: var(--text-muted);
            font-size: 12px;
        }

        .metric-val {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            font-size: 13px;
        }

        .metric-val.positive { color: var(--green); }
        .metric-val.negative { color: var(--red); }

        /* ── Data Table ──────────────────────────────────────────── */
        .table-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow);
            max-height: 70vh;
            overflow-y: auto;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .data-table thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .data-table th {
            background: var(--surface-alt);
            color: var(--accent);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 16px;
            text-align: left;
            border-bottom: 2px solid var(--border);
            white-space: nowrap;
            user-select: none;
        }

        .data-table th.sortable {
            cursor: pointer;
            transition: background var(--transition);
        }

        .data-table th.sortable:hover {
            background: rgba(88,166,255,0.12);
        }

        .data-table td {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(48,54,61,0.4);
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .data-table td:first-child {
            font-weight: 600;
            color: var(--accent);
        }

        .data-table td:nth-child(2) {
            font-family: 'Inter', sans-serif;
            color: var(--text);
        }

        .data-table td:nth-child(3) {
            font-family: 'Inter', sans-serif;
            color: var(--text-muted);
        }

        .data-table tbody tr {
            transition: background var(--transition);
        }

        .data-table tbody tr:hover {
            background: rgba(88,166,255,0.04);
        }

        .data-table td.positive { color: var(--green); }
        .data-table td.negative { color: var(--red); }

        /* ── Loading State ───────────────────────────────────────── */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            gap: 16px;
            color: var(--text-muted);
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 20px;
            font-size: 14px;
        }

        /* ── Section Headings ────────────────────────────────────── */
        .section-heading {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-heading::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--accent), var(--accent-alt));
            border-radius: 2px;
        }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 12px; padding: 12px 16px; }
            .header-meta { flex-direction: column; gap: 8px; }
            .tab-bar { padding: 0 12px; overflow-x: auto; }
            .tab-btn { padding: 12px 16px; font-size: 12px; }
            .tab-panel { padding: 16px; }
            .metric-cards { grid-template-columns: 1fr; }
        }

        /* ── Scrollbar ───────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>

<body>

<!-- ═══════════════════════════════════════════════════════════════════
     Header
     ═══════════════════════════════════════════════════════════════════ -->
<header class="header">
    <div class="header-left">
        <div class="logo-icon">Q</div>
        <h1><span>Quant</span> Research Platform</h1>
    </div>
    <div class="header-meta">
        <div class="meta-item">
            <span class="meta-label">Last Export</span>
            <span class="meta-value" id="export-timestamp">—</span>
        </div>
        <div class="meta-item">
            <span class="phase-badge" id="current-phase">Loading…</span>
        </div>
    </div>
</header>

<!-- ═══════════════════════════════════════════════════════════════════
     Tab Bar
     ═══════════════════════════════════════════════════════════════════ -->
<nav class="tab-bar" role="tablist">
    <button class="tab-btn active" data-tab="tab-performance" role="tab">📈 Performance</button>
    <button class="tab-btn" data-tab="tab-universe" role="tab">🔎 Universe</button>
    <button class="tab-btn" data-tab="tab-macro" role="tab">🌐 Macro Regime</button>
    <button class="tab-btn" data-tab="tab-heatmap" role="tab">🧩 Factor Heatmap</button>
</nav>

<!-- ═══════════════════════════════════════════════════════════════════
     Tab 1 — PERFORMANCE
     ═══════════════════════════════════════════════════════════════════ -->
<section id="tab-performance" class="tab-panel active" role="tabpanel">
    <h2 class="section-heading">Strategy Performance</h2>
    <div class="chart-container" id="perf-chart"></div>
    <div class="metric-cards" id="perf-cards"></div>
</section>

<!-- ═══════════════════════════════════════════════════════════════════
     Tab 2 — UNIVERSE
     ═══════════════════════════════════════════════════════════════════ -->
<section id="tab-universe" class="tab-panel" role="tabpanel">
    <h2 class="section-heading">Investment Universe</h2>
    <div class="table-container" id="universe-table"></div>
</section>

<!-- ═══════════════════════════════════════════════════════════════════
     Tab 3 — MACRO REGIME
     ═══════════════════════════════════════════════════════════════════ -->
<section id="tab-macro" class="tab-panel" role="tabpanel">
    <h2 class="section-heading">Macro Regime Indicators</h2>
    <div class="chart-container" id="macro-chart" style="min-height:540px;"></div>
</section>

<!-- ═══════════════════════════════════════════════════════════════════
     Tab 4 — FACTOR HEATMAP
     ═══════════════════════════════════════════════════════════════════ -->
<section id="tab-heatmap" class="tab-panel" role="tabpanel">
    <h2 class="section-heading">Fundamental Factor Z-Scores</h2>
    <div class="chart-container" id="heatmap-chart" style="min-height:480px;"></div>
</section>

<!-- Dashboard JS -->
<script src="dashboard.js"></script>

</body>
</html>
